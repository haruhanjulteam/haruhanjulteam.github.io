<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루한줄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,400;0,8..30,600;0,8..30,700;1,8..30,400&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F3ECDF;
    --bg-edge: #EBDCC0;
    --surface: #EADCC0;
    --border: #C9AE85;
    --text: #3A2E22;
    --text-secondary: #8A785D;
    --accent: #A8562E;
    --accent-soft: rgba(168, 86, 46, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221C15;
      --bg-edge: #1A150F;
      --surface: #3B301F;
      --border: #5C4B32;
      --text: #EDE3D0;
      --text-secondary: #A99A80;
      --accent: #E0854F;
      --accent-soft: rgba(224, 133, 79, 0.14);
    }
  }
  :root[data-theme="dark"] {
    --bg: #221C15;
    --bg-edge: #1A150F;
    --surface: #3B301F;
    --border: #5C4B32;
    --text: #EDE3D0;
    --text-secondary: #A99A80;
    --accent: #E0854F;
    --accent-soft: rgba(224, 133, 79, 0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    background: radial-gradient(120% 70% at 50% 0%, var(--bg) 0%, var(--bg-edge) 100%);
    color: var(--text);
    font-family: 'Work Sans', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: 72px 24px 96px;
  }

  header.doc-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    margin-bottom: 48px;
  }
  .brand-mark svg { display: block; opacity: 0.75; }
  .wordmark {
    font-family: 'Piazzolla', Georgia, serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.01em;
    color: var(--text);
    margin: 4px 0 0;
  }
  .tagline {
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
  }
  .lede {
    font-size: 16px;
    color: var(--text-secondary);
    text-align: center;
    max-width: 42ch;
    margin: 4px auto 0;
    text-wrap: balance;
  }

  section.block {
    padding: 28px 0;
    border-top: 1px solid var(--border);
  }
  section.block:first-of-type { border-top: none; padding-top: 0; }

  section.block h2 {
    font-family: 'Piazzolla', Georgia, serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 10px;
    text-align: center;
  }
  section.block p { margin: 0; font-size: 15px; text-align: center; color: var(--text); }

  nav.links {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  nav.links a {
    display: inline-block;
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
  }
  nav.links a:hover { border-color: var(--accent); color: var(--accent); }

  .contact-card {
    margin: 12px auto 0;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
  }
  .contact-card dt { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); margin-top: 10px; }
  .contact-card dt:first-child { margin-top: 0; }
  .contact-card dd { margin: 2px 0 0; font-size: 15px; }
  .contact-card a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-soft); text-underline-offset: 2px; }
  .contact-card a:hover { text-decoration-color: var(--accent); }

  footer.doc-foot {
    margin-top: 56px;
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

<div class="page">

  <header class="doc-head">
    <div class="brand-mark">
      <svg width="40" height="30" viewBox="0 0 240 240" fill="none">
        <path d="M 56 132 C 92 92, 150 150, 186 104" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="wordmark">하루한줄</div>
    <div class="tagline">KINDLINE</div>
    <p class="lede">매일 한 줄의 위로. 매일 하나의 명언, 고사성어, 속담으로 하루를 시작하는 앱입니다.</p>
  </header>

  <section class="block">
    <h2>이 앱에 대해</h2>
    <p>회원가입이나 로그인 없이 누구나 무료로 이용할 수 있는 개인용 콘텐츠 앱입니다. 하루에 한 번, 마음에 남는 한 줄을 전해드립니다.</p>
  </section>

  <section class="block">
    <h2>문의</h2>
    <p>앱 이용 중 궁금한 점이나 문의사항이 있으시면 아래 이메일로 연락해 주세요.</p>
    <dl class="contact-card">
      <dt>이메일</dt>
      <dd><a href="mailto:haruhanjul.team@gmail.com">haruhanjul.team@gmail.com</a></dd>
    </dl>
  </section>

  <section class="block">
    <h2>정책 안내</h2>
    <nav class="links">
      <a href="privacy.html">개인정보처리방침</a>
      <a href="terms.html">이용약관</a>
    </nav>
  </section>

  <footer class="doc-foot">
    하루한줄 (Kindline)
  </footer>

</div>

</body>
</html>
